[package]
name = "paginaverto-ocr"
description = "Character recognition for paginaverto: page image in, lines of text out."
readme = "../../README.md"
keywords = ["ocr", "text-recognition"]
categories = ["text-processing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# On crates.io (Baris, 2026-10-31). The licence files are copies of the
# repository's (a package holds only its own directory); preflight.sh checks
# they still match.
include = [
    "/src",
    "/LICENSE",
    "/LICENSE-COMMERCIAL.md",
    "/THIRD-PARTY-NOTICES.md",
]

[dependencies]
ocrs.workspace = true
rten.workspace = true
rten-tensor = "=0.26.0"
rten-imageproc = "=0.26.0"
image.workspace = true
