[package]
name = "paginaverto-ocr"
description = "Character recognition for paginaverto: page image in, lines of text out."
readme = "../../README.md"
keywords = ["ocr", "text-recognition"]
categories = ["text-processing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# On crates.io (Baris, 2026-10-31). The licence files are copies of the
# repository's (a package holds only its own directory); preflight.sh checks
# they still match.
include = ["/src", "/LICENSE", "/LICENSE-COMMERCIAL.md"]

[dependencies]
ocrs.workspace = true
rten.workspace = true
image.workspace = true
