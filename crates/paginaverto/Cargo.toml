[package]
name = "paginaverto"
description = "Reads PDFs and page images and turns them into a structured document, in pure Rust."
readme = "../../README.md"
keywords = ["pdf", "ocr", "text-extraction", "document"]
categories = ["text-processing", "parser-implementations"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# On crates.io (Baris, 2026-10-31). The licence files are copies of the
# repository's (a package holds only its own directory); preflight.sh checks
# they still match.
include = ["/src", "/tests", "/LICENSE", "/LICENSE-COMMERCIAL.md"]

[features]
default = []
# Character recognition for scans with no text layer. Pulls ocrs and rten
# through paginaverto-ocr; without it a scan is refused with
# `Error::ScanNeedsOcr`.
ocr = ["dep:paginaverto-ocr"]
# The command-line tool and its JSON report. Not a default: the default build
# must never pull ocrs or rten, and the tool reads scans.
cli = ["ocr", "dep:serde", "dep:serde_json", "dep:zip"]

[[bin]]
name = "paginaverto"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
lopdf.workspace = true
image.workspace = true
regex.workspace = true
paginaverto-ocr = { workspace = true, optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.145", optional = true }
# The family shares one zip major; the "deflate" feature is pure Rust.
zip = { version = "9.3.0", default-features = false, features = ["deflate"], optional = true }
