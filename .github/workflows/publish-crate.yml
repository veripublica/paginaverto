name: Publish to crates.io

# Publishes `paginaverto-ocr`, then `paginaverto`, when a `v*` tag is pushed.
# Taken from kepubverto's workflow of the same name (itself epubveri's); the
# family releases the same way. paginaverto-wasm is not published here: it
# goes to npm (publish-npm.yml).
#
# AUTHENTICATION — trusted publishing (OIDC), no stored token. crates.io hands
# out a short-lived token in exchange for a GitHub-signed claim about *which
# repo and which workflow file* is asking; the action's post step revokes it
# when the job ends.
#
# ONE-TIME SETUP (owner, on crates.io), for EACH of the two crates, after its
# first (hand) publish: crates.io -> <crate> -> Settings -> Trusted
# Publishing -> Add, repository `veripublica/paginaverto`, workflow
# `publish-crate.yml`. Until that exists the auth step fails and nothing is
# published. Renaming this file breaks the trust link.
#
# Publishing is IRREVERSIBLE: a version number, once used, can never be reused
# (only yanked). So the job refuses to publish unless the tag and the manifests
# agree, and the tests pass, before it uploads anything. paginaverto pins
# paginaverto-ocr with `=X.Y.Z`, so the OCR crate goes first.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.2)"
        required: true
      # Run the OIDC exchange, prove a token comes back, publish nothing.
      # Worth running after the setup, and after anything that could break
      # the link (renaming this file, moving the repo).
      verify_only:
        description: "Only check that crates.io auth works; publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Guard 1: the tag must match every manifest. All three crates share the
      # workspace version; the wasm one decides the npm package's version.
      - name: Verify tag matches the manifests
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          want="${tag#v}"
          meta=$(cargo metadata --no-deps --format-version 1)
          for p in paginaverto paginaverto-ocr paginaverto-wasm; do
            got=$(jq -e -r --arg p "$p" '.packages[] | select(.name == $p) | .version' <<< "$meta")
            echo "tag=$want  $p=$got"
            [ "$want" = "$got" ] || { echo "::error::tag $tag does not match $p version $got"; exit 1; }
          done

      # Guard 2: re-runs are harmless. Each crate is checked on its own, so a
      # run that published the OCR crate and then failed can be re-run.
      - name: Which crates still need publishing
        id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          todo=""
          for c in paginaverto-ocr paginaverto; do
            if curl -sf -H "User-Agent: paginaverto-release (github.com/veripublica/paginaverto)" \
                 "https://crates.io/api/v1/crates/$c/$ver" > /dev/null; then
              echo "::notice::$c $ver is already published."
            else
              todo="$todo $c"
            fi
          done
          echo "todo=${todo# }" >> "$GITHUB_OUTPUT"
          [ -n "$todo" ] && echo "skip=false" >> "$GITHUB_OUTPUT" || echo "skip=true" >> "$GITHUB_OUTPUT"

      # Guard 3: never publish code that does not pass its own tests, with and
      # without OCR, at the exact commit being published.
      - name: Test (workspace)
        if: steps.check.outputs.skip == 'false' && !inputs.verify_only
        run: |
          cargo test --workspace --locked
          cargo test --workspace --locked --features paginaverto/ocr

      - name: Authenticate with crates.io
        if: steps.check.outputs.skip == 'false' || inputs.verify_only
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Report auth result (verify-only)
        if: inputs.verify_only
        run: |
          if [ -n "${{ steps.auth.outputs.token }}" ]; then
            echo "::notice::Trusted publishing works — crates.io issued a token. Nothing was published."
          else
            echo "::error::No token returned; the crates.io trusted-publishing link is not working."
            exit 1
          fi

      # In order: cargo waits until paginaverto-ocr is in the index before
      # publishing paginaverto, which needs it.
      - name: Publish
        if: steps.check.outputs.skip == 'false' && !inputs.verify_only
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          TODO: ${{ steps.check.outputs.todo }}
        run: |
          set -euo pipefail
          for c in $TODO; do cargo publish -p "$c" --locked; done
