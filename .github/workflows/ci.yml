name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Format (cargo fmt --check)
        run: cargo fmt --all --check

      # The default build must stay light: no ocrs, no rten (epublift's web
      # and default builds depend on that).
      - name: Default build pulls no OCR engine
        run: |
          set -euo pipefail
          if cargo tree -p paginaverto -p paginaverto-wasm -e normal --locked | grep -E '^.*(ocrs|rten) v'; then
            echo "error: the default build pulls ocrs/rten" >&2; exit 1
          fi

      - name: Clippy (default, ocr, cli)
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --workspace --all-targets --locked --features paginaverto/ocr -- -D warnings
          cargo clippy --workspace --all-targets --locked --features paginaverto/cli -- -D warnings

      - name: Test (default, ocr, cli)
        run: |
          cargo test --workspace --locked
          cargo test --workspace --locked --features paginaverto/ocr
          cargo test --workspace --locked --features paginaverto/cli

      # The browser crate must keep compiling for wasm32 (lopdf's getrandom
      # needs its Web Crypto backend there).
      - name: Build paginaverto-wasm for wasm32
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p paginaverto-wasm --target wasm32-unknown-unknown --locked

      # Out of the workspace, so nothing above builds it, and a change to the
      # library's API can break it unseen.
      - name: The OCR accuracy tool still compiles
        run: cargo check --manifest-path tools/ocr-accuracy/Cargo.toml --locked

      - name: Docs (rustdoc, warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked --features paginaverto/ocr

  # OCR on the public accuracy set, with the models users download: a CER above
  # the limit, or page images reading other than the same pages in a PDF, fails.
  # The only job that needs the network beyond crates.io: about 10 MB, checked
  # against the SHA-256 the library publishes.
  ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fonts (Liberation, metric copies of Arial and Times)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends fonts-liberation

      - name: Download the OCR models
        run: |
          set -euo pipefail
          mkdir -p models
          curl -fsSL --retry 3 -o models/text-detection.onnx \
            https://ocrs-models.s3-accelerate.amazonaws.com/text-detection.onnx
          curl -fsSL --retry 3 -o models/latin_PP-OCRv5_mobile_rec.onnx \
            https://huggingface.co/PaddlePaddle/latin_PP-OCRv5_mobile_rec_onnx/resolve/89d3a50e2c27e2e7cceeab0e944c25c807d5db4f/inference.onnx
          sha256sum -c <<'SUMS'
          a917b23dbd9524b465df7e922641b3ff2981623df4ded5a0234004ef2fee7cfe  models/text-detection.onnx
          7888113072263cb471b93f66dd5e2ad70548dc526fa1ace760d0d973dd121498  models/latin_PP-OCRv5_mobile_rec.onnx
          SUMS

      - name: Accuracy set through OCR
        env:
          OCR_MAX_CER: "2.0"
        run: |
          set -euo pipefail
          f=/usr/share/fonts/truetype/liberation
          cargo run --release --locked --manifest-path tools/ocr-accuracy/Cargo.toml -- \
            models "$f/LiberationSans-Regular.ttf" "$f/LiberationSerif-Regular.ttf"

  # The declared MSRV, actually compiled.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the declared MSRV
        id: msrv
        run: |
          set -euo pipefail
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          test -n "$v" || { echo "error: no rust-version in Cargo.toml" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install it
        run: |
          rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
          rustup default "${{ steps.msrv.outputs.version }}"

      - name: Compile at the floor
        run: cargo check --workspace --locked --features paginaverto/cli

  # RustSec audit of Cargo.lock, its own job: its verdict depends on the
  # advisory database, not on our commit.
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
