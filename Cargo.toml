[workspace]
members = ["crates/paginaverto", "crates/paginaverto-ocr", "crates/paginaverto-wasm"]
exclude = ["tools/ocr-accuracy"]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
# No newer than epublift's (latest stable - 2), its first consumer.
rust-version = "1.97"
license = "AGPL-3.0-only OR LicenseRef-veripublica-Commercial"
repository = "https://github.com/veripublica/paginaverto"
homepage = "https://github.com/veripublica/paginaverto"

[workspace.dependencies]
paginaverto-ocr = { path = "crates/paginaverto-ocr", version = "=0.1.4" }
# 0.1.0 is a parity release with epublift cli-v4.5.1: the engines are pinned
# to the exact versions epublift's Cargo.lock resolves, because their
# behaviour (lopdf's `extract_text` above all) is part of the output.
# Upgrade only from 0.2.0 on, and measure.
lopdf = "=0.45.0"
ocrs = "=0.13.1"
# onnx_format: the models ocrs serves today are .onnx (the .rten files answer
# 403). Model::load detects the format from the bytes.
rten = { version = "=0.26.0", features = ["onnx_format"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
regex = "1.13.1"

# family-web's measured WASM profile (wasm/BUILD-PROFILE.md): smaller and
# faster than the default. Native builds of this workspace only; a crate that
# depends on paginaverto (epublift) keeps its own profile.
[profile.release]
opt-level = 2
lto = true
codegen-units = 1
